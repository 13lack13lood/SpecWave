[package]
name = "specwave-bench"
description = "SpecWave measurements: per-layer timing, coverage with the real codec, wave calibration, end to end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["candle"]
# The real encoder, i.e. specwave's candle feature. It pulls in C/C++ build scripts, so cross-target checks turn it off.
candle = ["specwave/candle"]

[dependencies]
# The trials and the tests read ColdIVF's trace of each search, which times its stages and counts what it read.
coldivf = { workspace = true, features = ["inmem", "bench"] }
specwave = { workspace = true, features = ["bench"] }
# bytemuck: reads the mapped vector files as f32 and u32 values after checking their alignment and length.
bytemuck = "1.25.2"
# memmap2: maps the vector files, so a build reads the documents without loading them.
memmap2 = "0.9.11"
# serde_json: reads the query texts, the layer timings and the coverage results back from their JSON-lines files.
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
# libc: msync and mincore, which drop files from the system's cache and check what stays, the read hints of the wave
# calibration, and pthread_set_qos_class_self_np, so the timings run at the user-interactive quality of service.
libc = "0.2.190"

[[bin]]
name = "spec"
path = "src/bin/spec.rs"
required-features = ["candle"]

[[bin]]
name = "layers"
path = "src/bin/layers.rs"
required-features = ["candle"]

[[bin]]
name = "train"
path = "src/bin/train.rs"
required-features = ["candle"]
