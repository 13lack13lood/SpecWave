[package]
name = "specwave"
description = "Fire ColdIVF's read waves from inside the embedding model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The candle encoder. It is off by default so cross-target checks stay pure Rust.
# It brings in candle-core, candle-nn and tokenizers 0.22 with only the "onig" feature.
# That feature adds a regex library with C/C++ build scripts.
candle = ["dep:candle-core", "dep:candle-nn", "dep:tokenizers", "dep:serde", "dep:serde_json"]

[dependencies]
coldivf.workspace = true
# candle-core, candle-nn: the tensors and layers of the BERT encoder.
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
# tokenizers: reads the model's tokenizer.json. It is the copy candle-core already pulls in.
tokenizers = { version = "0.22.2", optional = true, default-features = false, features = ["onig"] }
# serde, serde_json: read the model's config.json and its sentence-transformers settings.
serde = { version = "1.0.228", optional = true, features = ["derive"] }
serde_json = { version = "1.0.145", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# On macOS the matrix products on the processor go through Accelerate, and the graphics processor runs on Metal.
candle-core = { version = "0.11.0", optional = true, features = ["accelerate", "metal"] }
candle-nn = { version = "0.11.0", optional = true, features = ["accelerate", "metal"] }
